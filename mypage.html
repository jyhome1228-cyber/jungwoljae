<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="정월재 마이페이지" />
  <title>마이페이지 — 정월재</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./page.css" />
</head>
<body>
  <header class="site-header">
    <div class="wide-container header-inner">
      <a class="brand" href="./index.html" aria-label="정월재 홈"><span class="brand-hanja">正月齋</span><span class="brand-korean">정월재</span></a>
      <nav class="desktop-nav"></nav>
      <a class="header-cta" href="./mypage.html">마이페이지</a>
      <button class="menu-button" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="mobile-menu" data-menu-button><span></span><span></span></button>
    </div>
    <div class="mobile-menu" id="mobile-menu" hidden data-mobile-menu><nav class="container"></nav></div>
  </header>

  <main class="mypage-main" data-mypage>
    <div class="container">
      <div class="mypage-head">
        <div><p class="eyebrow">MY PAGE</p><h1>나의 정월재</h1><p>등록한 사주 기본 정보와 풀이 기록을 한곳에서 확인합니다.</p></div>
      </div>
      <p class="firebase-warning" data-mypage-status>회원 정보를 불러오는 중입니다.</p>
      <div class="mypage-grid">
        <section class="mypage-card">
          <h2>회원 정보</h2>
          <dl class="profile-list">
            <div class="profile-row"><dt>아이디</dt><dd data-profile="userId">—</dd></div>
            <div class="profile-row"><dt>이메일</dt><dd data-profile="email">—</dd></div>
            <div class="profile-row"><dt>성함</dt><dd data-profile="name">—</dd></div>
            <div class="profile-row"><dt>태어난 날짜</dt><dd data-profile="birthDate">—</dd></div>
            <div class="profile-row"><dt>태어난 시간</dt><dd data-profile="birthTime">—</dd></div>
            <div class="profile-row"><dt>달력 기준</dt><dd data-profile="calendarType">—</dd></div>
            <div class="profile-row"><dt>성별</dt><dd data-profile="gender">—</dd></div>
            <div class="profile-row"><dt>지역</dt><dd data-profile="city">—</dd></div>
          </dl>
        </section>
        <aside class="mypage-card">
          <h2>나의 기록</h2>
          <div class="mypage-links">
            <a class="mypage-link" href="./archive.html">정월록 보기</a>
            <a class="mypage-link" href="./saju.html">종합 사주 보기</a>
            <a class="mypage-link" href="./fortune.html">오늘의 운세 보기</a>
            <a class="mypage-link" href="./reviews.html">내 후기 확인</a>
          </div>
          <button class="mypage-logout" type="button" data-logout>로그아웃</button>
        </aside>
      </div>
    </div>
  </main>

  <footer class="site-footer"></footer>
  <script src="./app.js" defer></script>
</body>
</html>
