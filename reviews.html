<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="정월재 이용 후기" />
  <title>이용 후기 — 정월재</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./page.css" />
  <link rel="stylesheet" href="./reviews-fix.css?v=20260911-1635" />
</head>
<body data-reviews-page="true">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="site-header"><div class="wide-container header-inner"><a class="brand" href="./index.html" aria-label="정월재 홈"><span class="brand-hanja">正月齋</span><span class="brand-korean">정월재</span></a><nav class="desktop-nav"></nav><a class="header-cta" href="./signup.html">회원등록</a><button class="menu-button" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="mobile-menu" data-menu-button><span></span><span></span></button></div><div class="mobile-menu" id="mobile-menu" hidden data-mobile-menu><nav class="container"></nav></div></header>

  <main id="main">
    <section class="review-page-hero"><div class="container"><p class="section-label">REVIEW ARCHIVE</p><h1>정월재 이용 후기</h1><p>정월재를 이용한 분들이 남긴 후기를 한곳에서 확인할 수 있습니다. 서비스별 경험과 실제 사용 후 느낀 점을 편하게 살펴보세요.</p></div></section>
    <section class="review-page"><div class="container">
      <div class="review-stats"><div class="review-stat"><strong data-review-count>0</strong><span>누적 후기</span></div><div class="review-stat is-accent"><strong data-review-average>—</strong><span>평균 평점</span></div><div class="review-stat"><strong>11</strong><span>후기 카테고리</span></div></div>

      <section class="review-composer" data-review-composer hidden>
        <div class="review-toolbar">
          <div>
            <p class="section-label">WRITE REVIEW</p>
            <h2>후기 남기기</h2>
            <p class="review-write-copy">로그인 없이 누구나 후기를 남길 수 있습니다. 이름과 이메일은 받지 않으며 작성자는 ‘익명 사용자’로 표시됩니다.</p>
          </div>
          <button class="button button-ghost" type="button" data-review-close>닫기</button>
        </div>
        <form data-review-form>
          <div class="review-form-grid">
            <div class="field">
              <label for="review-service">이용 서비스</label>
              <select id="review-service" name="service" required>
                <option value="">서비스를 선택해주세요</option>
                <option>오행 분석</option>
                <option>오늘의 운세</option>
                <option>내일의 운세</option>
                <option>연애와 인연</option>
                <option>궁합</option>
                <option>일과 재물</option>
                <option>정월도감</option>
                <option>정월부적</option>
                <option>행운의 숫자</option>
                <option>중요한 날</option>
                <option>이사 택일</option>
              </select>
            </div>
            <div class="field">
              <label for="review-rating">평점</label>
              <select id="review-rating" name="rating" required>
                <option value="5">5점 · 매우 만족</option>
                <option value="4">4점 · 만족</option>
                <option value="3">3점 · 보통</option>
                <option value="2">2점 · 아쉬움</option>
                <option value="1">1점 · 매우 아쉬움</option>
              </select>
            </div>
            <div class="field full">
              <label for="review-content">후기 내용</label>
              <textarea id="review-content" name="content" maxlength="500" placeholder="이용하면서 느낀 점을 10자 이상 적어주세요." required></textarea>
              <p class="review-helper">등록한 후기는 즉시 공개되며 다른 방문자에게 익명으로 표시됩니다.</p>
            </div>
            <div class="review-honeypot" aria-hidden="true">
              <label for="review-website">웹사이트</label>
              <input id="review-website" name="website" type="text" tabindex="-1" autocomplete="off" />
            </div>
          </div>
          <div class="review-form-actions"><button class="button button-ghost" type="button" data-review-close>취소</button><button class="button button-accent" type="submit">후기 등록하기</button></div>
        </form>
      </section>

      <div class="review-toolbar"><div><p class="section-label">ALL REVIEWS</p><h2>후기 모아보기</h2></div><div class="review-toolbar-actions"><select class="review-filter" data-review-filter aria-label="후기 서비스 필터"><option value="all">전체 서비스</option><option>오행 분석</option><option>오늘의 운세</option><option>내일의 운세</option><option>연애와 인연</option><option>궁합</option><option>일과 재물</option><option>정월도감</option><option>정월부적</option><option>행운의 숫자</option><option>중요한 날</option><option>이사 택일</option></select><button class="button button-accent" type="button" data-review-open>후기 등록</button></div></div>
      <p class="form-status" role="status" aria-live="polite" data-review-status></p><div class="review-grid" data-review-grid></div><div class="review-pagination"><button type="button" aria-label="이전 후기" data-review-prev>‹</button><span data-review-page>1 / 1</span><button type="button" aria-label="다음 후기" data-review-next>›</button></div>
    </div></section>
  </main>
  <footer class="site-footer"></footer>
  <script src="./app.js?v=20260911-1218" defer></script>
  <script type="module" src="./reviews.js?v=20260911-1648"></script>
  <script src="./reviews-demo.js?v=20260911-1618" defer></script>
  <script src="./retired-service-cleanup.js?v=20260911-1218" defer></script>
</body>
</html>
